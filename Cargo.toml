[package]
name = "transparentbar"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Taskbar transparan Windows, dengan startup opsional"

[lib]
name = "transparentbar_bridge"
path = "src/bridge.rs"
crate-type = ["cdylib"]

[dependencies]
windows-core = "=0.58.0"
windows = { version = "=0.58.0", default-features = false, features = [
    "implement",
    "Foundation",
    "UI_Core",
    "Win32_System_Ole",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
