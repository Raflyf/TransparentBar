[package]
name = "transparentbar"
version = "0.2.7"
edition = "2021"
license = "MIT"
description = "Native Windows taskbar transparency utility with optional startup"

[lib]
name = "transparentbar_bridge"
path = "src/bridge.rs"
crate-type = ["cdylib"]

[dependencies]
windows-core = "=0.58.0"
windows = { version = "=0.58.0", default-features = false, features = [
    "implement",
    "Foundation",
    "UI_Core",
    "System",
    "Win32_System_Ole",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Memory",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_Networking_WinHttp",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level = 2
lto = "thin"
strip = "symbols"
panic = "unwind"
